<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candy Memory Word Game</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* ==========================================================================
       1. CORE STYLES & CANDY THEME
       ========================================================================== */
    :root {
      --bg-color: #fcf4dd;
      --card-blue: #a0c4ff;
      --card-orange: #ffc6ff;
      --card-green: #caffbf;
      --card-back: #ffadad;
      --text-color: #4a4e69;
      --button-bg: #bdb2ff;
      --button-hover: #9bf6ff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    /* ==========================================================================
       2. CONTROL PANEL (Inputs, Buttons, Timer)
       ========================================================================== */
    .controls {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    input[type="number"], input[type="file"] {
      padding: 8px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background-color: var(--button-bg);
      color: #333;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--button-hover);
      transform: translateY(-2px);
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .timer-display {
      font-size: 1.5rem;
      font-weight: bold;
      min-width: 60px;
      text-align: center;
      color: #e63946;
    }

    /* ==========================================================================
       3. 3D FLIP CARDS
       ========================================================================== */
    .card-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      perspective: 1000px; /* Essential for 3D perspective */
      width: 100%;
      max-width: 900px;
    }

    .card {
      width: 30%;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    /* Flip trigger class */
    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden; /* Hides reverse side when turned away */
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 10px;
      box-sizing: border-box;
      word-break: break-word;
      text-align: center;
    }

    /* Front side colors */
    .card-left .card-front   { background-color: var(--card-blue); }
    .card-middle .card-front { background-color: var(--card-orange); }
    .card-right .card-front  { background-color: var(--card-green); }

    /* Card Back (Covered state) */
    .card-back {
      background-color: var(--card-back);
      color: white;
      transform: rotateY(180deg); /* Pre-rotated back side */
    }
  </style>
</head>
<body>

  <h1>🍬 Word Memory Game</h1>

  <div class="controls">
    <div class="control-group">
      <label for="excelFile">1. Upload Excel (.xlsx):</label>
      <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <div class="control-group">
      <label for="timerInput">2. Seconds:</label>
      <input type="number" id="timerInput" min="1" max="60" value="5">
    </div>

    <button id="startBtn" disabled>Start Game</button>
    <button id="checkBtn" disabled>Check Answers</button>

    <div class="timer-display" id="timerDisplay">0s</div>
  </div>

  <div class="card-container">
    <div class="card card-left" id="card0">
      <div class="card-face card-front">Upload Words</div>
      <div class="card-face card-back">❓</div>
    </div>
    <div class="card card-middle" id="card1">
      <div class="card-face card-front">To Begin</div>
      <div class="card-face card-back">❓</div>
    </div>
    <div class="card card-right" id="card2">
      <div class="card-face card-front">The Game</div>
      <div class="card-face card-back">❓</div>
    </div>
  </div>

  <script>
    // State Variables
    let wordList = [];
    let timerInterval = null;
    let currentWords = [];

    // DOM Elements
    const fileInput = document.getElementById('excelFile');
    const timerInput = document.getElementById('timerInput');
    const startBtn = document.getElementById('startBtn');
    const checkBtn = document.getElementById('checkBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const cards = [
      document.getElementById('card0'),
      document.getElementById('card1'),
      document.getElementById('card2')
    ];

    /* --------------------------------------------------------------------------
       Feature A: LocalStorage Persisted Timer
       -------------------------------------------------------------------------- */
    // Load saved timer value on initialization
    const savedTime = localStorage.getItem('memoryGameTimer');
    if (savedTime) {
      timerInput.value = savedTime;
    }

    // Save timer value whenever input changes
    timerInput.addEventListener('change', () => {
      localStorage.setItem('memoryGameTimer', timerInput.value);
    });

    /* --------------------------------------------------------------------------
       Feature B: Parsing Excel File via SheetJS
       -------------------------------------------------------------------------- */
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        // Grab the first worksheet
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        // Convert sheet to JSON array
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        
        // Flatten 2D array and filter empty cells/non-strings
        wordList = jsonData
          .flat()
          .map(item => String(item).trim())
          .filter(item => item.length > 0);

        if (wordList.length >= 3) {
          startBtn.disabled = false;
          alert(`Success! Loaded ${wordList.length} words.`);
        } else {
          alert('Please upload an Excel file containing at least 3 words.');
          startBtn.disabled = true;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    /* --------------------------------------------------------------------------
       Feature C: Game Control Logic
       -------------------------------------------------------------------------- */
    startBtn.addEventListener('click', startGame);
    checkBtn.addEventListener('click', revealCards);

    function startGame() {
      if (wordList.length < 3) return;

      // 1. Reset state & controls
      clearInterval(timerInterval);
      checkBtn.disabled = true;
      startBtn.disabled = true;

      // 2. Unflip cards to show front side
      cards.forEach(card => card.classList.remove('flipped'));

      // 3. Randomly select 3 unique words
      const shuffled = [...wordList].sort(() => 0.5 - Math.random());
      currentWords = shuffled.slice(0, 3);

      // 4. Update Card Front Content
      cards.forEach((card, index) => {
        card.querySelector('.card-front').textContent = currentWords[index];
      });

      // 5. Start Countdown Timer
      let timeLeft = parseInt(timerInput.value, 10) || 5;
      timerDisplay.textContent = `${timeLeft}s`;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timeIsUp();
        }
      }, 1000);
    }

    function timeIsUp() {
      // Flip all cards to hide words
      cards.forEach(card => card.classList.add('flipped'));
      
      // Enable the Check button and re-enable Start button
      checkBtn.disabled = false;
      startBtn.disabled = false;
      timerDisplay.textContent = 'Time!';
    }

    function revealCards() {
      // Flip cards back over so user can inspect memory accuracy
      cards.forEach(card => card.classList.remove('flipped'));
      checkBtn.disabled = true;
    }
  </script>
</body>
</html>
